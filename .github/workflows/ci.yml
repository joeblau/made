name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.filter.outputs.apple || steps.filter-all.outputs.apple }}
      docs: ${{ steps.filter.outputs.docs || steps.filter-all.outputs.docs }}
      workers: ${{ steps.filter.outputs.workers || steps.filter-all.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Manual runs have no PR base to diff against; select every gate.
      - id: filter-all
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: printf 'apple=true\ndocs=true\nworkers=true\n' >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            apple:
              - 'apple/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ghosttykit-bootstrap.yml'
              - '.github/workflows/chromiumkit-bootstrap.yml'
              - '.github/workflows/chromiumkit-monitor.yml'
              - '.github/workflows/apple-release.yml'
            docs:
              - '**/*.md'
              - 'bin/check-docs.sh'
              - '.github/workflows/ci.yml'
            workers:
              - 'workers/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/check-docs.sh

  workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run ci

  apple-lint:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - name: Lint changed Swift
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            apple/bin/lint-swift.sh --changed "origin/${{ github.base_ref }}"
          else
            apple/bin/lint-swift.sh --all
          fi

  apple-build-test:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    # A hung xcodebuild otherwise burns the 6-hour runner default (seen when a
    # deployment-target change stalled Network.framework-dependent tests).
    timeout-minutes: 90
    env:
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.ci-source-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.ci-source-packages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/made.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift', 'apple/Packages/ChromiumKit/Package.swift', 'apple/Packages/ChromiumKit/cef-artifacts.json') }}
      - name: Validate Chromium artifact lock
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          bash apple/bin/test-chromiumkit-update-rollback.sh
      - name: Validate application icons
        run: apple/bin/app-icon-tool.swift validate
      - name: Verify generated Xcode project
        run: |
          apple/bin/install-xcodegen.sh generate --spec apple/project.yml --project apple
          git diff --exit-code -- apple/made.xcodeproj
      - name: Compile every application
        run: apple/bin/build-ci.sh
      - name: Run unit tests
        run: apple/bin/test.sh all

  # Exercises the signed Chromium assembly + validation path on every PR so
  # signing regressions surface here instead of at release time. Signs ad-hoc;
  # the release workflow remains the only lane with real credentials.
  apple-chromium-smoke:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    permissions:
      attestations: read
      contents: read
    env:
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.ci-source-packages
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.cef-download-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.ci-source-packages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/made.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift', 'apple/Packages/ChromiumKit/Package.swift', 'apple/Packages/ChromiumKit/cef-artifacts.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/Packages/ChromiumKit/Artifacts
            apple/.cef-download-cache
          key: cef-runtime-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/Packages/ChromiumKit/cef-artifacts.json', 'apple/bin/package-chromiumkit.sh', 'apple/bin/update-chromiumkit-artifact.sh') }}
      - name: Install the pinned Chromium runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          if ! apple/bin/verify-installed-chromiumkit.sh >/dev/null 2>&1; then
            release_id="$(jq -r '.releaseID' \
              apple/Packages/ChromiumKit/cef-artifacts.json)"
            runtime_tag="chromiumkit-$release_id"
            runtime_directory="$RUNNER_TEMP/chromiumkit-release"
            mkdir -p "$runtime_directory"

            if gh release view "$runtime_tag" >/dev/null 2>&1; then
              gh release verify "$runtime_tag"
              for asset in \
                ChromiumKitCEF.runtime.zip \
                ChromiumKitCEF.release.json \
                ChromiumKitCEF.checksums.txt; do
                gh release download "$runtime_tag" \
                  --pattern "$asset" --dir "$runtime_directory"
                gh release verify-asset \
                  "$runtime_tag" "$runtime_directory/$asset"
              done
              apple/bin/update-chromiumkit-artifact.sh \
                --release-directory "$runtime_directory"
            else
              printf '%s\n' \
                'No immutable ChromiumKit release found; reproducing the pinned runtime.'
              apple/bin/update-chromiumkit-artifact.sh
            fi
          fi
          apple/bin/verify-installed-chromiumkit.sh
      - name: Build and validate an ad-hoc signed Chromium Pilot
        run: |
          derived_data="$RUNNER_TEMP/chromium-smoke-derived-data"
          DISABLE_SWIFTLINT=1 xcodebuild build -quiet \
            -project apple/made.xcodeproj \
            -scheme Pilot \
            -configuration Chromium \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$derived_data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            BLAU_CHROMIUM_CODESIGN_TIMESTAMP=NO
          apple/bin/validate-chromium-archive.sh --allow-ad-hoc \
            "$derived_data/Build/Products/Chromium/made.app"

  complete:
    if: always()
    needs: [changes, docs, workers, apple-lint, apple-build-test, apple-chromium-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
          echo "Selected CI gates passed: $RESULTS"
