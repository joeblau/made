name: CI

on:
  pull_request:
  # Pull requests test a merge preview, never the commit that lands. Every
  # commit on main gets its own full run, which apple-release.yml requires
  # before it builds a release tag.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer main commit must not cancel the run that proves an older one, so
  # pushes and manual runs are grouped per commit and never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Every job runs on the Blau enterprise's Mac mini cluster. On a fork pull
    # request only this job and `complete` run, and neither executes code from
    # the pull request.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    outputs:
      apple: ${{ steps.filter.outputs.apple || steps.filter-all.outputs.apple }}
      docs: ${{ steps.filter.outputs.docs || steps.filter-all.outputs.docs }}
      workers: ${{ steps.filter.outputs.workers || steps.filter-all.outputs.workers }}
    steps:
      # The minis keep workspaces between jobs. An earlier LFS checkout leaves
      # hooks and filters that need git-lfs, which this job doesn't install.
      - name: Reset the persistent workspace
        run: rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only pull requests are path-filtered. Main pushes and manual runs
      # select every gate so each commit a release can tag is fully proven.
      - id: filter-all
        if: ${{ github.event_name != 'pull_request' }}
        run: printf 'apple=true\ndocs=true\nworkers=true\n' >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            apple:
              - 'apple/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ghosttykit-bootstrap.yml'
              - '.github/workflows/chromiumkit-bootstrap.yml'
              - '.github/workflows/chromiumkit-monitor.yml'
              - '.github/workflows/apple-release.yml'
            docs:
              - '**/*.md'
              - 'bin/check-docs.sh'
              - '.github/workflows/ci.yml'
            workers:
              - 'workers/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'

  docs:
    needs: changes
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, macmini]
    steps:
      # The minis keep workspaces between jobs. An earlier LFS checkout leaves
      # hooks and filters that need git-lfs, which this job doesn't install.
      - name: Reset the persistent workspace
        run: rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/check-docs.sh

  workers:
    needs: changes
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.workers == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, macmini]
    steps:
      # The minis keep workspaces between jobs. An earlier LFS checkout leaves
      # hooks and filters that need git-lfs, which this job doesn't install.
      - name: Reset the persistent workspace
        run: rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate this job's home directory
        run: .github/scripts/isolate-job-home.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run ci

  apple-lint:
    needs: changes
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.apple == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The Blau enterprise's Mac mini cluster; each job selects its Xcode.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    steps:
      # The minis keep workspaces between jobs. An earlier LFS checkout leaves
      # hooks and filters that need git-lfs, which this job doesn't install.
      - name: Reset the persistent workspace
        run: rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare macOS runner (Xcode 27)
        run: .github/scripts/prepare-macos-runner.sh 27
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - name: Lint changed Swift
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            apple/bin/lint-swift.sh --changed "origin/${{ github.base_ref }}"
          else
            apple/bin/lint-swift.sh --all
          fi

  apple-build-test:
    needs: changes
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.apple == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The Blau enterprise's Mac mini cluster; each job selects its Xcode.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    # A hung xcodebuild otherwise burns the 6-hour runner default (seen when a
    # deployment-target change stalled Network.framework-dependent tests).
    timeout-minutes: 90
    steps:
      # The minis don't ship git-lfs; checkout needs it on PATH before the
      # repository (and its scripts) exist, so install a pinned copy inline.
      - name: Install git-lfs (pinned)
        env:
          GIT_LFS_VERSION: 3.8.1
          GIT_LFS_SHA256: 0ba10e897e0496412cd86eacaed4ed554c97ddc29bc5c709d28faa5eaaa2222c
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/git-lfs"
          zip="$dir/git-lfs.zip"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-darwin-arm64-v${GIT_LFS_VERSION}.zip"
          echo "${GIT_LFS_SHA256}  ${zip}" | shasum -a 256 --check --strict
          unzip -q -j -o "$zip" "git-lfs-${GIT_LFS_VERSION}/git-lfs" -d "$dir"
          "$dir/git-lfs" version
          echo "$dir" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Prepare macOS runner (Xcode 27)
        run: .github/scripts/prepare-macos-runner.sh 27
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - name: Validate Chromium artifact lock
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          bash apple/bin/test-chromiumkit-update-rollback.sh
          bash apple/bin/test-cockpit-build.sh
      - name: Validate application icons
        run: apple/bin/app-icon-tool.swift validate
      - name: Verify generated Xcode project
        run: apple/bin/install-xcodegen.sh check-committed
      - name: Validate Apple CI script orchestration
        run: bash apple/bin/test-apple-ci-scripts.sh
      # build-ci.sh and test.sh share per-platform derived data so the test
      # step reuses the compiled Cockpit, Walkie, and Kneeboard hosts.
      - name: Compile every application
        run: apple/bin/build-ci.sh
      # The Drone terminal proof drives real tmux sessions. Build tmux from
      # SHA-256 pinned sources rather than a runner-dependent Homebrew bottle,
      # and fail unless the tmux the apps select is exactly that pinned version.
      # The apps look in /opt/homebrew/bin, /usr/local/bin, then /usr/bin. The
      # minis have Homebrew and no passwordless sudo, so the pinned build goes
      # into the first of those directories that is writable (renamed into
      # place, so a concurrent job never sees a partial binary); elsewhere it
      # falls back to sudo into /usr/local/bin.
      - name: Install pinned tmux
        run: |
          tmux_binary="$(apple/bin/install-tmux.sh path)"
          installed=""
          for dir in /opt/homebrew/bin /usr/local/bin; do
            [[ -d "$dir" && -w "$dir" ]] || continue
            staged="$(mktemp "$dir/.tmux.XXXXXX")"
            install -m 0755 "$tmux_binary" "$staged"
            mv -f "$staged" "$dir/tmux"
            installed="$dir/tmux"
            break
          done
          if [[ -z "$installed" ]]; then
            sudo -n install -d /usr/local/bin
            sudo -n install -m 0755 "$tmux_binary" /usr/local/bin/tmux
          fi
          apple/bin/install-tmux.sh verify
      # The minis' runners are LaunchDaemons, and XCTest only reaches
      # testmanagerd from the console user's GUI session.
      - name: Run unit tests
        run: .github/scripts/run-in-gui-session.sh apple/bin/test.sh all

  # Exercises the signed Chromium assembly + validation path on every PR so
  # signing regressions surface here instead of at release time. Signs ad-hoc;
  # the release workflow remains the only lane with real credentials.
  chromium-runtime:
    needs: changes
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.apple == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The pinned CEF runtime reproduces byte-for-byte only under the pinned
    # Xcode major (buildToolchain.xcodeVersionPrefix in cef-artifacts.json).
    # Reproduce it once here and hand it to the app build through the cache.
    # The Blau enterprise's Mac mini cluster; each job selects its Xcode.
    runs-on: [self-hosted, macOS, ARM64, macmini]
    permissions:
      attestations: read
      contents: read
    env:
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.cef-download-cache
    steps:
      # The minis don't ship git-lfs; checkout needs it on PATH before the
      # repository (and its scripts) exist, so install a pinned copy inline.
      - name: Install git-lfs (pinned)
        env:
          GIT_LFS_VERSION: 3.8.1
          GIT_LFS_SHA256: 0ba10e897e0496412cd86eacaed4ed554c97ddc29bc5c709d28faa5eaaa2222c
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/git-lfs"
          zip="$dir/git-lfs.zip"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-darwin-arm64-v${GIT_LFS_VERSION}.zip"
          echo "${GIT_LFS_SHA256}  ${zip}" | shasum -a 256 --check --strict
          unzip -q -j -o "$zip" "git-lfs-${GIT_LFS_VERSION}/git-lfs" -d "$dir"
          "$dir/git-lfs" version
          echo "$dir" >> "$GITHUB_PATH"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - name: Prepare macOS runner (Xcode 27)
        run: .github/scripts/prepare-macos-runner.sh 27
      - name: Verify artifact toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/Packages/ChromiumKit/Artifacts
            apple/.cef-download-cache
          key: cef-runtime-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('apple/Packages/ChromiumKit/cef-artifacts.json', 'apple/bin/package-chromiumkit.sh', 'apple/bin/update-chromiumkit-artifact.sh') }}
      - name: Install the pinned Chromium runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          if ! apple/bin/verify-installed-chromiumkit.sh >/dev/null 2>&1; then
            release_id="$(jq -r '.releaseID' \
              apple/Packages/ChromiumKit/cef-artifacts.json)"
            runtime_tag="chromiumkit-$release_id"
            runtime_directory="$RUNNER_TEMP/chromiumkit-release"
            mkdir -p "$runtime_directory"

            if gh release view "$runtime_tag" >/dev/null 2>&1; then
              gh release verify "$runtime_tag"
              for asset in \
                ChromiumKitCEF.runtime.zip \
                ChromiumKitCEF.release.json \
                ChromiumKitCEF.checksums.txt; do
                gh release download "$runtime_tag" \
                  --pattern "$asset" --dir "$runtime_directory"
                gh release verify-asset \
                  "$runtime_tag" "$runtime_directory/$asset"
              done
              apple/bin/update-chromiumkit-artifact.sh \
                --release-directory "$runtime_directory"
            else
              printf '%s\n' \
                'No immutable ChromiumKit release found; reproducing the pinned runtime.'
              apple/bin/update-chromiumkit-artifact.sh
            fi
          fi
          apple/bin/verify-installed-chromiumkit.sh

  apple-chromium-smoke:
    needs: [changes, chromium-runtime]
    # Public repo: fork pull requests never run on the self-hosted minis.
    if: needs.changes.outputs.apple == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Stays on GitHub-hosted Xcode 27 for now: Xcode 27.2 (the minis) refuses
    # to ad-hoc sign Cockpit's macOS App Group (group.app.blau.pilot) without
    # a provisioning profile, and the archive validator checks Pilot's
    # entitlements exactly. Move it to the minis once the group is settled.
    runs-on: xcode-27
    permissions:
      attestations: read
      contents: read
    env:
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.cef-download-cache
    steps:
      # The minis don't ship git-lfs; checkout needs it on PATH before the
      # repository (and its scripts) exist, so install a pinned copy inline.
      - name: Install git-lfs (pinned)
        env:
          GIT_LFS_VERSION: 3.8.1
          GIT_LFS_SHA256: 0ba10e897e0496412cd86eacaed4ed554c97ddc29bc5c709d28faa5eaaa2222c
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/git-lfs"
          zip="$dir/git-lfs.zip"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-darwin-arm64-v${GIT_LFS_VERSION}.zip"
          echo "${GIT_LFS_SHA256}  ${zip}" | shasum -a 256 --check --strict
          unzip -q -j -o "$zip" "git-lfs-${GIT_LFS_VERSION}/git-lfs" -d "$dir"
          "$dir/git-lfs" version
          echo "$dir" >> "$GITHUB_PATH"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - name: Prepare macOS runner (Xcode 27)
        run: .github/scripts/prepare-macos-runner.sh 27
      - name: Verify supported toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/Packages/ChromiumKit/Artifacts
            apple/.cef-download-cache
          key: cef-runtime-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('apple/Packages/ChromiumKit/cef-artifacts.json', 'apple/bin/package-chromiumkit.sh', 'apple/bin/update-chromiumkit-artifact.sh') }}
          # The chromium-runtime job reproduced the runtime under this exact
          # key; a miss here means the handoff broke, not that this Xcode 27
          # job should rebuild it.
          fail-on-cache-miss: true
      - name: Verify the pinned Chromium runtime
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          apple/bin/verify-installed-chromiumkit.sh
      - name: Build and validate an ad-hoc signed Chromium Pilot
        run: |
          derived_data="$RUNNER_TEMP/chromium-smoke-derived-data"
          DISABLE_SWIFTLINT=1 xcodebuild build -quiet \
            -project apple/made.xcodeproj \
            -scheme Pilot \
            -configuration Chromium \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$derived_data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            BLAU_CHROMIUM_CODESIGN_TIMESTAMP=NO
          apple/bin/validate-chromium-archive.sh --allow-ad-hoc \
            "$derived_data/Build/Products/Chromium/Cockpit.app"

  complete:
    if: always()
    needs: [changes, docs, workers, apple-lint, apple-build-test, chromium-runtime, apple-chromium-smoke]
    runs-on: [self-hosted, macOS, ARM64, macmini]
    steps:
      - name: Require every selected gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GATES_SELECTED: ${{ needs.changes.outputs.apple == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.workers == 'true' }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
          # Every gate is skipped on a fork PR, so a fork's change can't pass
          # here; a maintainer re-pushes it to a branch in this repo.
          if [[ "$FORK_PULL_REQUEST" == "true" && "$GATES_SELECTED" == "true" ]]; then
            echo "::error::Pull requests from a fork need a maintainer to push them to a branch in openblau/made for self-hosted CI."
            exit 1
          fi
          echo "Selected CI gates passed: $RESULTS"
