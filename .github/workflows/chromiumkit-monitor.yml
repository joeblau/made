name: ChromiumKit Upstream Support

on:
  schedule:
    - cron: "17 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromiumkit-upstream-support
  cancel-in-progress: true

jobs:
  verify-support:
    # The Blau enterprise's Mac mini cluster (docs/operations.md).
    runs-on: [self-hosted, macOS, ARM64, macmini]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require latest supported stable Chromium
        run: bash apple/bin/verify-chromiumkit-support.sh
