name: Apple Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string
      successful_mobile_run_id:
        description: Prior Apple Release run with both TestFlight jobs successful
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.release.outputs.build-number }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          SUCCESSFUL_MOBILE_RUN_ID: ${{ github.event.inputs.successful_mobile_run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$REQUESTED_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH: %s\n' \
              "$release_tag" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/tags/$release_tag:refs/tags/$release_tag" \
            main:refs/remotes/origin/main
          release_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Release tag did not resolve to a commit: %s\n' \
              "$release_tag" >&2
            exit 1
          }
          # A tag push names the commit that triggered this run; refuse a tag
          # that was moved before validation instead of releasing its new
          # target. Peel GITHUB_SHA in case it names an annotated tag object.
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
            "$release_commit" != "$(git rev-parse --verify --quiet \
              "$GITHUB_SHA^{commit}")" ]]; then
            printf 'Release tag moved after it was pushed: %s\n' \
              "$release_tag" >&2
            exit 1
          fi
          git merge-base --is-ancestor \
            "$release_commit" refs/remotes/origin/main || {
            printf 'Release tag is not on origin/main: %s\n' \
              "$release_tag" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$SUCCESSFUL_MOBILE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              printf 'Invalid prior Apple Release run ID: %s\n' \
                "$SUCCESSFUL_MOBILE_RUN_ID" >&2
              exit 1
            }
            run="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESSFUL_MOBILE_RUN_ID")"
            jq -e \
              --arg tag "$release_tag" \
              --arg commit "$release_commit" \
              '.status == "completed" and
               .event == "push" and
               .head_branch == $tag and
               .head_sha == $commit' <<< "$run" >/dev/null || {
              printf '%s\n' \
                'Prior run does not belong to this release tag and commit.' >&2
              exit 1
            }
            jobs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESSFUL_MOBILE_RUN_ID/jobs?filter=latest&per_page=100")"
            for name in 'TestFlight (Copilot)' 'TestFlight (Plotter)'; do
              jq -e --arg name "$name" \
                '.jobs | any(.name == $name and .conclusion == "success")' \
                <<< "$jobs" >/dev/null || {
                printf 'Prior run did not complete successfully: %s\n' \
                  "$name" >&2
                exit 1
              }
            done
          fi

          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${release_tag#v}" >> "$GITHUB_OUTPUT"
          printf 'build-number=%s.%s\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      # The release becomes GitHub's latest release, which the website's
      # download link and Cockpit's Sparkle feed (releases/latest) follow.
      - name: Require a release above every published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build-number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          build_pattern='^[0-9]{1,9}(\.[0-9]{1,9}){0,3}$'
          # Succeeds only when dotted number $1 is strictly greater than $2,
          # comparing components numerically as Sparkle compares bundle versions.
          dotted_gt() {
            local -a left right
            local index count l r
            IFS=. read -r -a left <<< "$1"
            IFS=. read -r -a right <<< "$2"
            count=$(( ${#left[@]} > ${#right[@]} ? ${#left[@]} : ${#right[@]} ))
            for (( index = 0; index < count; index++ )); do
              l=$(( 10#${left[index]:-0} ))
              r=$(( 10#${right[index]:-0} ))
              (( l > r )) && return 0
              (( l < r )) && return 1
            done
            return 1
          }
          [[ "$RELEASE_TAG" =~ $semver ]] || {
            printf 'Release tags must use vMAJOR.MINOR.PATCH: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          }
          [[ "$RELEASE_BUILD_NUMBER" =~ $build_pattern ]] || {
            printf 'Invalid release build number: %s\n' \
              "$RELEASE_BUILD_NUMBER" >&2
            exit 1
          }

          # Every published (non-draft) semantic release, not only the one
          # GitHub currently marks latest, so an earlier mis-marked release
          # cannot hide a higher version.
          releases="$RUNNER_TEMP/published-releases.json"
          listing="$RUNNER_TEMP/published-releases.tsv"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          (( $(wc -c < "$releases") <= 67108864 )) || {
            printf '%s\n' 'Release listing exceeds 64 MiB.' >&2
            exit 1
          }
          jq -r '.[] | select(.draft | not) |
            [.tag_name, (any(.assets[]?; .name == "appcast.xml") | tostring)] |
            @tsv' "$releases" > "$listing"
          highest=''
          highest_has_appcast=false
          while IFS=$'\t' read -r tag has_appcast; do
            [[ "$tag" =~ $semver ]] || continue
            if [[ -z "$highest" ]] || dotted_gt "${tag#v}" "${highest#v}"; then
              highest="$tag"
              highest_has_appcast="$has_appcast"
            fi
          done < "$listing"
          if [[ -z "$highest" ]]; then
            printf 'No published semantic release precedes %s.\n' "$RELEASE_TAG"
            exit 0
          fi
          dotted_gt "${RELEASE_TAG#v}" "${highest#v}" || {
            printf '%s is not above the highest published release %s.\n' \
              "$RELEASE_TAG" "$highest" >&2
            printf '%s\n' \
              'Publishing it as latest would roll back the download link and Sparkle feed; tag a higher version.' >&2
            exit 1
          }

          # Sparkle orders updates by CFBundleVersion, so the new build must
          # also exceed the build the current highest release's feed offers.
          if [[ "$highest_has_appcast" != true ]]; then
            printf '%s has no Sparkle appcast; compared versions only.\n' \
              "$highest"
            exit 0
          fi
          feed_directory="$RUNNER_TEMP/highest-release-appcast"
          rm -rf "$feed_directory"
          mkdir -p "$feed_directory"
          gh release download "$highest" --repo "$GITHUB_REPOSITORY" \
            --pattern appcast.xml --dir "$feed_directory"
          feed="$feed_directory/appcast.xml"
          if [[ ! -f "$feed" ]] || (( $(wc -c < "$feed") > 1048576 )); then
            printf 'Missing or oversized appcast for %s.\n' "$highest" >&2
            exit 1
          fi
          { grep -oE \
              '<sparkle:version>[^<]*</sparkle:version>|sparkle:version="[^"]*"' \
              "$feed" || true; } |
            sed -E 's#^<sparkle:version>##; s#</sparkle:version>$##;
              s#^sparkle:version="##; s#"$##' > "$feed_directory/builds"
          previous_build=''
          while IFS= read -r build; do
            [[ "$build" =~ $build_pattern ]] || {
              printf 'Unreadable Sparkle build in %s appcast: %s\n' \
                "$highest" "$build" >&2
              exit 1
            }
            if [[ -z "$previous_build" ]] ||
              dotted_gt "$build" "$previous_build"; then
              previous_build="$build"
            fi
          done < "$feed_directory/builds"
          [[ -n "$previous_build" ]] || {
            printf 'No Sparkle build number in %s appcast.\n' "$highest" >&2
            exit 1
          }
          dotted_gt "$RELEASE_BUILD_NUMBER" "$previous_build" || {
            printf 'Build %s is not above build %s published by %s.\n' \
              "$RELEASE_BUILD_NUMBER" "$previous_build" "$highest" >&2
            exit 1
          }
          printf '%s (build %s) is above %s (build %s).\n' \
            "$RELEASE_TAG" "$RELEASE_BUILD_NUMBER" "$highest" "$previous_build"

      # Pull-request CI tests a merge preview, not the commit a tag points at.
      # Require ci.yml's own push or manual run of the release commit to have
      # passed Swift lint and the unit tests before anything is signed.
      - name: Require passing Apple CI for the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Unexpected release commit: %s\n' "$release_commit" >&2
            exit 1
          }
          # CI for main can still be running when the tag is pushed. A commit
          # with no CI run at all fails after a short grace period instead.
          deadline=$((SECONDS + ${RELEASE_CI_WAIT_SECONDS:-14400}))
          grace=$((SECONDS + ${RELEASE_CI_GRACE_SECONDS:-600}))
          while :; do
            runs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_commit&per_page=100")"
            candidates="$(jq -c \
              --arg commit "$release_commit" \
              --arg repo "$GITHUB_REPOSITORY" \
              '[.workflow_runs[] |
                select(.head_sha == $commit and
                  .head_repository.full_name == $repo and
                  (.event == "push" or .event == "workflow_dispatch"))]' \
              <<< "$runs")"
            for run_id in $(jq -r \
              '.[] | select(.status == "completed" and .conclusion == "success") | .id' \
              <<< "$candidates"); do
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
              jobs="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
              if jq -e \
                '[.jobs[] |
                  select((.name == "apple-lint" or .name == "apple-build-test") and
                    .conclusion == "success") | .name] | unique | length == 2' \
                <<< "$jobs" >/dev/null; then
                printf 'CI run %s passed Apple lint and unit tests for %s.\n' \
                  "$run_id" "$release_commit"
                exit 0
              fi
            done
            if jq -e 'length > 0 and all(.[]; .status == "completed")' \
              <<< "$candidates" >/dev/null; then
              printf 'No passing Apple lint and unit-test CI run for %s at %s.\n' \
                "$RELEASE_TAG" "$release_commit" >&2
              exit 1
            fi
            if [[ "$(jq 'length' <<< "$candidates")" == 0 ]] &&
              (( SECONDS >= grace )); then
              printf 'No CI run exists for %s at %s; run ci.yml on the tag.\n' \
                "$RELEASE_TAG" "$release_commit" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              printf 'Timed out waiting for CI on %s at %s.\n' \
                "$RELEASE_TAG" "$release_commit" >&2
              exit 1
            fi
            sleep "${RELEASE_CI_POLL_SECONDS:-60}"
          done

  chromium-runtime:
    name: Reproduce the pinned Chromium runtime
    needs: release-metadata
    # The pinned CEF runtime reproduces byte-for-byte only under Xcode 26
    # (buildToolchain.xcodeVersionPrefix in cef-artifacts.json). The xcode-27
    # image carries no Xcode 26, so reproduce the runtime here and hand it to
    # the Xcode 27 release build through the cache.
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      attestations: read
      contents: read
    env:
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.release-cef-download-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          ref: ${{ needs.release-metadata.outputs.commit }}
      # Build the commit release-metadata validated, never whatever the tag
      # names now: the tag can move while the apple-release approval waits.
      - name: Verify the validated release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release-metadata.outputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Invalid validated release commit: %s\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }
          head="$(git rev-parse HEAD)"
          [[ "$head" == "$RELEASE_COMMIT" ]] || {
            printf 'Checked out %s instead of validated release commit %s\n' \
              "$head" "$RELEASE_COMMIT" >&2
            exit 1
          }
      - name: Verify artifact toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/Packages/ChromiumKit/Artifacts
            apple/.release-cef-download-cache
          key: release-cef-runtime-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/Packages/ChromiumKit/cef-artifacts.json', 'apple/bin/package-chromiumkit.sh', 'apple/bin/update-chromiumkit-artifact.sh') }}
      - name: Install the pinned Chromium runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags release the reviewed lock exactly. Upstream freshness is a
          # ChromiumKit maintenance concern, not a reproducible-release gate.
          bash apple/bin/package-chromiumkit.sh manifest

          if ! apple/bin/verify-installed-chromiumkit.sh >/dev/null 2>&1; then
            release_id="$(jq -r '.releaseID' \
              apple/Packages/ChromiumKit/cef-artifacts.json)"
            runtime_tag="chromiumkit-$release_id"
            runtime_directory="$RUNNER_TEMP/chromiumkit-release"
            mkdir -p "$runtime_directory"

            if gh release view "$runtime_tag" >/dev/null 2>&1; then
              gh release verify "$runtime_tag"
              for asset in \
                ChromiumKitCEF.runtime.zip \
                ChromiumKitCEF.release.json \
                ChromiumKitCEF.checksums.txt; do
                gh release download "$runtime_tag" \
                  --pattern "$asset" --dir "$runtime_directory"
                gh release verify-asset \
                  "$runtime_tag" "$runtime_directory/$asset"
              done
              apple/bin/update-chromiumkit-artifact.sh \
                --release-directory "$runtime_directory"
            else
              printf '%s\n' \
                'No immutable ChromiumKit release found; reproducing the pinned runtime.'
              apple/bin/update-chromiumkit-artifact.sh
            fi
          fi
          apple/bin/verify-installed-chromiumkit.sh

  macos:
    name: Signed and notarized Pilot
    needs: [release-metadata, chromium-runtime]
    # Xcode 27 ships on its own preview image; macos-26 only carries Xcode 26.x.
    runs-on: xcode-27
    environment: apple-release
    timeout-minutes: 240
    permissions:
      attestations: read
      contents: read
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
      BLAU_CHROMIUM_CODESIGN_TIMESTAMP: YES
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.release-source-packages
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.release-cef-download-cache
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          ref: ${{ needs.release-metadata.outputs.commit }}
      # Build the commit release-metadata validated, never whatever the tag
      # names now: the tag can move while the apple-release approval waits.
      - name: Verify the validated release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release-metadata.outputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Invalid validated release commit: %s\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }
          head="$(git rev-parse HEAD)"
          [[ "$head" == "$RELEASE_COMMIT" ]] || {
            printf 'Checked out %s instead of validated release commit %s\n' \
              "$head" "$RELEASE_COMMIT" >&2
            exit 1
          }
      - name: Install the recovered release test harness
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:apple/bin/test-chromium-runtime.sh" \
            > "$RUNNER_TEMP/test-chromium-runtime.sh"
          install -m 755 "$RUNNER_TEMP/test-chromium-runtime.sh" \
            apple/bin/test-chromium-runtime.sh
      - name: Require release credentials
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || {
              printf 'Missing apple-release secret: %s\n' "$name" >&2
              exit 1
            }
          done
      - name: Verify supported Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.release-source-packages
          key: apple-release-macos-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('apple/made.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift', 'apple/Packages/ChromiumKit/Package.swift', 'apple/Packages/ChromiumKit/cef-artifacts.json') }}
      - name: Import Developer ID identity
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/apple-release-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode \
            > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          printf 'RELEASE_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Install App Store Connect API key
        shell: bash
        run: |
          key_directory="$RUNNER_TEMP/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64" |
            base64 --decode > "$key_path"
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$key_path" \
            >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/Packages/ChromiumKit/Artifacts
            apple/.release-cef-download-cache
          key: release-cef-runtime-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/Packages/ChromiumKit/cef-artifacts.json', 'apple/bin/package-chromiumkit.sh', 'apple/bin/update-chromiumkit-artifact.sh') }}
          # The chromium-runtime job reproduced the runtime under this exact
          # key; a miss here means the handoff broke, not that this Xcode 27
          # job should rebuild it.
          fail-on-cache-miss: true
      - name: Verify the pinned Chromium runtime
        shell: bash
        run: |
          bash apple/bin/package-chromiumkit.sh manifest
          apple/bin/verify-installed-chromiumkit.sh
      - name: Generate and verify the Xcode project
        run: |
          apple/bin/install-xcodegen.sh check-committed
          apple/bin/app-icon-tool.swift validate
      - name: Run the signed Chromium release gates
        env:
          BLAU_CHROMIUM_TEST_CODE_SIGN_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
          BLAU_CHROMIUM_TEST_DEVELOPMENT_TEAM: ${{ env.APPLE_TEAM_ID }}
          BLAU_CHROMIUM_TEST_RESULT_ROOT: ${{ runner.temp }}/chromium-gate-results
        run: |
          for architecture in arm64 x86_64; do
            DEVELOPER_DIR="$(xcode-select -p)" \
            BLAU_CHROMIUM_TEST_ARCHITECTURE="$architecture" \
              apple/bin/test-chromium-runtime.sh
          done
      - name: Upload Chromium gate results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-gate-results
          path: ${{ runner.temp }}/chromium-gate-results
          if-no-files-found: ignore
      - name: Archive signed universal Pilot
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Pilot.xcarchive"
          xcodebuild archive \
            -project apple/made.xcodeproj \
            -scheme Pilot \
            -configuration Chromium \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/Pilot-derived-data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER"
          [[ "$(plutil -extract CFBundleShortVersionString raw \
            "$archive/Products/Applications/Cockpit.app/Contents/Info.plist")" \
            == "$RELEASE_VERSION" ]]
          [[ "$(plutil -extract CFBundleVersion raw \
            "$archive/Products/Applications/Cockpit.app/Contents/Info.plist")" \
            == "$RELEASE_BUILD_NUMBER" ]]
      - name: Export Developer ID signed Cockpit
        shell: bash
        run: |
          export_options="$RUNNER_TEMP/DeveloperIDExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string developer-id "$export_options"
          plutil -insert destination -string export "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate \
            -string "$MACOS_SIGNING_IDENTITY" "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pilot.xcarchive" \
            -exportPath "$RUNNER_TEMP/Pilot-export" \
            -exportOptionsPlist "$export_options"

          app="$RUNNER_TEMP/Pilot-export/Cockpit.app"
          apple/bin/validate-chromium-archive.sh "$app"
          [[ "$(plutil -extract CFBundleShortVersionString raw \
            "$app/Contents/Info.plist")" == "$RELEASE_VERSION" ]]
          [[ "$(plutil -extract CFBundleVersion raw \
            "$app/Contents/Info.plist")" == "$RELEASE_BUILD_NUMBER" ]]
      - name: Notarize and staple Pilot
        shell: bash
        run: |
          app="$RUNNER_TEMP/Pilot-export/Cockpit.app"
          submission="$RUNNER_TEMP/Pilot-notarization.zip"
          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$APP_STORE_CONNECT_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 45m
          xcrun stapler staple "$app"
          apple/bin/validate-chromium-archive.sh \
            --require-notarization "$app"
      - name: Package the macOS download
        shell: bash
        run: |
          release_directory="$RUNNER_TEMP/apple-release"
          asset="made-${RELEASE_VERSION}-macOS.zip"
          mkdir -p "$release_directory"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/Pilot-export/Cockpit.app" \
            "$release_directory/$asset"
          (
            cd "$release_directory"
            shasum -a 256 "$asset" > "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          )
      - name: Generate the signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            printf '%s\n' \
              'Missing apple-release secret: SPARKLE_PRIVATE_KEY' >&2
            exit 1
          }
          generate_appcast="$(find "$BLAU_SOURCE_PACKAGES/artifacts" \
            -type f -path '*/Sparkle/bin/generate_appcast' \
            -perm -111 -print -quit)"
          [[ -n "$generate_appcast" ]] || {
            printf '%s\n' 'Sparkle generate_appcast tool was not resolved.' >&2
            exit 1
          }
          sign_update="${generate_appcast%/*}/sign_update"
          [[ -x "$sign_update" ]] || {
            printf '%s\n' 'Sparkle sign_update tool was not resolved.' >&2
            exit 1
          }
          release_directory="$RUNNER_TEMP/apple-release"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$generate_appcast" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --link 'https://blau.app/made' \
              --maximum-deltas 0 \
              -o "$release_directory/appcast.xml" \
              "$release_directory"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$sign_update" --ed-key-file - --verify \
              "$release_directory/appcast.xml"
          grep -Fq 'sparkle:edSignature=' "$release_directory/appcast.xml"
          grep -Fq \
            "releases/download/$RELEASE_TAG/made-${RELEASE_VERSION}-macOS.zip" \
            "$release_directory/appcast.xml"
      # Create the installer after generate_appcast so Sparkle continues to
      # select the versioned ZIP as its sole update enclosure.
      - name: Package, sign, and notarize the disk image
        shell: bash
        run: |
          image="$RUNNER_TEMP/apple-release/Cockpit.dmg"
          apple/bin/package-macos-dmg.sh \
            "$RUNNER_TEMP/Pilot-export/Cockpit.app" "$image"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$image"
          codesign --verify --strict "$image"
          xcrun notarytool submit "$image" \
            --key "$APP_STORE_CONNECT_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 45m
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature "$image"
          (
            cd "$RUNNER_TEMP/apple-release"
            shasum -a 256 Cockpit.dmg > Cockpit.dmg.sha256
            shasum -a 256 -c Cockpit.dmg.sha256
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ needs.release-metadata.outputs.version }}
          path: ${{ runner.temp }}/apple-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "${APP_STORE_CONNECT_KEY_PATH:-$RUNNER_TEMP/missing-key}"

  testflight:
    name: TestFlight (${{ matrix.scheme }})
    needs: release-metadata
    if: ${{ github.event_name == 'push' }}
    # Xcode 27 ships on its own preview image; macos-26 only carries Xcode 26.x.
    runs-on: xcode-27
    environment: apple-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - Copilot
          - Plotter
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.release-source-packages
      RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          ref: ${{ needs.release-metadata.outputs.commit }}
      # Build the commit release-metadata validated, never whatever the tag
      # names now: the tag can move while the apple-release approval waits.
      - name: Verify the validated release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release-metadata.outputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Invalid validated release commit: %s\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }
          head="$(git rev-parse HEAD)"
          [[ "$head" == "$RELEASE_COMMIT" ]] || {
            printf 'Checked out %s instead of validated release commit %s\n' \
              "$head" "$RELEASE_COMMIT" >&2
            exit 1
          }
      - name: Require release credentials
        shell: bash
        run: |
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64; do
            [[ -n "${!name:-}" ]] || {
              printf 'Missing apple-release secret: %s\n' "$name" >&2
              exit 1
            }
          done
      - name: Verify supported Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.release-source-packages
          key: apple-release-mobile-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('apple/made.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift') }}
      - name: Install App Store Connect API key
        shell: bash
        run: |
          key_directory="$RUNNER_TEMP/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64" |
            base64 --decode > "$key_path"
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$key_path" \
            >> "$GITHUB_ENV"
      - name: Generate and verify the Xcode project
        run: |
          apple/bin/install-xcodegen.sh check-committed
          apple/bin/app-icon-tool.swift validate
      - name: Archive ${{ matrix.scheme }}
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          archive="$RUNNER_TEMP/$SCHEME.xcarchive"
          xcodebuild archive \
            -project apple/made.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/$SCHEME-derived-data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER"

          app_plist="$archive/Products/Applications/$SCHEME.app/Info.plist"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$app_plist")" \
            == "$RELEASE_VERSION" ]]
          [[ "$(plutil -extract CFBundleVersion raw "$app_plist")" \
            == "$RELEASE_BUILD_NUMBER" ]]
      - name: Upload ${{ matrix.scheme }} to TestFlight
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          export_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string automatic "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber \
            -bool false "$export_options"
          plutil -insert uploadSymbols -bool true "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/$SCHEME-export" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove App Store Connect API key
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${APP_STORE_CONNECT_KEY_PATH:-$RUNNER_TEMP/missing-key}"

  publish:
    name: Publish GitHub release
    needs:
      - release-metadata
      - macos
      - testflight
    if: >-
      ${{
        always() &&
        needs.release-metadata.result == 'success' &&
        needs.macos.result == 'success' &&
        (needs.testflight.result == 'success' ||
          needs.testflight.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    # Serialize publication across tags so the ordering check and
    # `gh release create --latest` cannot interleave with another release.
    concurrency:
      group: apple-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-${{ needs.release-metadata.outputs.version }}
          path: ${{ runner.temp }}/apple-release
      - name: Verify release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/apple-release"
          asset="made-${RELEASE_VERSION}-macOS.zip"
          [[ -f "$asset" && -f "$asset.sha256" && -f appcast.xml ]]
          [[ -f Cockpit.dmg && -f Cockpit.dmg.sha256 ]]
          [[ "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" == 5 ]]
          shasum -a 256 -c "$asset.sha256"
          shasum -a 256 -c Cockpit.dmg.sha256
          grep -Fq 'sparkle:edSignature=' appcast.xml
      # Repeat the ordering check at publication: another tag's release may
      # have published since release-metadata ran. Keep this step identical
      # to the release-metadata one; test-apple-ci-scripts.sh enforces it.
      - name: Require a release above every published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          build_pattern='^[0-9]{1,9}(\.[0-9]{1,9}){0,3}$'
          # Succeeds only when dotted number $1 is strictly greater than $2,
          # comparing components numerically as Sparkle compares bundle versions.
          dotted_gt() {
            local -a left right
            local index count l r
            IFS=. read -r -a left <<< "$1"
            IFS=. read -r -a right <<< "$2"
            count=$(( ${#left[@]} > ${#right[@]} ? ${#left[@]} : ${#right[@]} ))
            for (( index = 0; index < count; index++ )); do
              l=$(( 10#${left[index]:-0} ))
              r=$(( 10#${right[index]:-0} ))
              (( l > r )) && return 0
              (( l < r )) && return 1
            done
            return 1
          }
          [[ "$RELEASE_TAG" =~ $semver ]] || {
            printf 'Release tags must use vMAJOR.MINOR.PATCH: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          }
          [[ "$RELEASE_BUILD_NUMBER" =~ $build_pattern ]] || {
            printf 'Invalid release build number: %s\n' \
              "$RELEASE_BUILD_NUMBER" >&2
            exit 1
          }

          # Every published (non-draft) semantic release, not only the one
          # GitHub currently marks latest, so an earlier mis-marked release
          # cannot hide a higher version.
          releases="$RUNNER_TEMP/published-releases.json"
          listing="$RUNNER_TEMP/published-releases.tsv"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          (( $(wc -c < "$releases") <= 67108864 )) || {
            printf '%s\n' 'Release listing exceeds 64 MiB.' >&2
            exit 1
          }
          jq -r '.[] | select(.draft | not) |
            [.tag_name, (any(.assets[]?; .name == "appcast.xml") | tostring)] |
            @tsv' "$releases" > "$listing"
          highest=''
          highest_has_appcast=false
          while IFS=$'\t' read -r tag has_appcast; do
            [[ "$tag" =~ $semver ]] || continue
            if [[ -z "$highest" ]] || dotted_gt "${tag#v}" "${highest#v}"; then
              highest="$tag"
              highest_has_appcast="$has_appcast"
            fi
          done < "$listing"
          if [[ -z "$highest" ]]; then
            printf 'No published semantic release precedes %s.\n' "$RELEASE_TAG"
            exit 0
          fi
          dotted_gt "${RELEASE_TAG#v}" "${highest#v}" || {
            printf '%s is not above the highest published release %s.\n' \
              "$RELEASE_TAG" "$highest" >&2
            printf '%s\n' \
              'Publishing it as latest would roll back the download link and Sparkle feed; tag a higher version.' >&2
            exit 1
          }

          # Sparkle orders updates by CFBundleVersion, so the new build must
          # also exceed the build the current highest release's feed offers.
          if [[ "$highest_has_appcast" != true ]]; then
            printf '%s has no Sparkle appcast; compared versions only.\n' \
              "$highest"
            exit 0
          fi
          feed_directory="$RUNNER_TEMP/highest-release-appcast"
          rm -rf "$feed_directory"
          mkdir -p "$feed_directory"
          gh release download "$highest" --repo "$GITHUB_REPOSITORY" \
            --pattern appcast.xml --dir "$feed_directory"
          feed="$feed_directory/appcast.xml"
          if [[ ! -f "$feed" ]] || (( $(wc -c < "$feed") > 1048576 )); then
            printf 'Missing or oversized appcast for %s.\n' "$highest" >&2
            exit 1
          fi
          { grep -oE \
              '<sparkle:version>[^<]*</sparkle:version>|sparkle:version="[^"]*"' \
              "$feed" || true; } |
            sed -E 's#^<sparkle:version>##; s#</sparkle:version>$##;
              s#^sparkle:version="##; s#"$##' > "$feed_directory/builds"
          previous_build=''
          while IFS= read -r build; do
            [[ "$build" =~ $build_pattern ]] || {
              printf 'Unreadable Sparkle build in %s appcast: %s\n' \
                "$highest" "$build" >&2
              exit 1
            }
            if [[ -z "$previous_build" ]] ||
              dotted_gt "$build" "$previous_build"; then
              previous_build="$build"
            fi
          done < "$feed_directory/builds"
          [[ -n "$previous_build" ]] || {
            printf 'No Sparkle build number in %s appcast.\n' "$highest" >&2
            exit 1
          }
          dotted_gt "$RELEASE_BUILD_NUMBER" "$previous_build" || {
            printf 'Build %s is not above build %s published by %s.\n' \
              "$RELEASE_BUILD_NUMBER" "$previous_build" "$highest" >&2
            exit 1
          }
          printf '%s (build %s) is above %s (build %s).\n' \
            "$RELEASE_TAG" "$RELEASE_BUILD_NUMBER" "$highest" "$previous_build"
      # gh release create --verify-tag attaches the release to whatever the
      # tag names now; refuse to publish if that is not the built commit.
      - name: Verify the release tag still names the validated commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.release-metadata.outputs.commit }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Invalid validated release commit: %s\n' \
              "$RELEASE_COMMIT" >&2
            exit 1
          }
          object="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.type + " " + .object.sha')"
          # Peel annotated tags (bounded) down to the commit they name.
          for _ in 1 2 3 4; do
            [[ "${object%% *}" == tag ]] || break
            object="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/${object#* }" \
              --jq '.object.type + " " + .object.sha')"
          done
          [[ "$object" == "commit $RELEASE_COMMIT" ]] || {
            printf 'Release tag %s now names %s, not validated commit %s\n' \
              "$RELEASE_TAG" "$object" "$RELEASE_COMMIT" >&2
            exit 1
          }
      - name: Publish the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            printf 'Refusing to replace existing release: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          }
          notes="$RUNNER_TEMP/install-notes.md"
          cat > "$notes" <<'EOF'
          Download **Cockpit.dmg**, open it, and drag **Cockpit.app** to **Applications**.
          Launch Cockpit from Applications and follow the setup screen to approve
          permissions and configure optional developer tools.

          Requires **macOS 26 or later**. Includes Apple silicon and Intel support.
          Existing installations can use **Cockpit > Check for Updates…**.
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "made $RELEASE_VERSION" \
            --generate-notes \
            --notes-file "$notes" \
            "$RUNNER_TEMP/apple-release/Cockpit.dmg" \
            "$RUNNER_TEMP/apple-release/Cockpit.dmg.sha256" \
            "$RUNNER_TEMP/apple-release/made-${RELEASE_VERSION}-macOS.zip" \
            "$RUNNER_TEMP/apple-release/made-${RELEASE_VERSION}-macOS.zip.sha256" \
            "$RUNNER_TEMP/apple-release/appcast.xml"
