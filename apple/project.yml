name: made
options:
  bundleIdPrefix: app.blau
  deploymentTarget:
    iOS: "26.0"
    # Goal floor is 15.0 and the code is ready for it (see GlassCompat and the
    # #available toolbar guards), but the Xcode 26 SDK breaks Network.framework
    # for binaries targeting < 26: NWListener pinned to loopback never reaches
    # .ready and AF_UNIX NWConnection (Docker transport) times out. Verified by
    # A/B at target 15 vs 26 on the same SDK; the Xcode 27 SDK fixes it. Lower
    # this to "15.0" once CI's pinned toolchain moves to Xcode 27.
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  Chromium: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: K78G42H4U2
    # Work around XcodeGen/Xcode's iOS SwiftPM integration losing Jinja's
    # transitive OrderedCollections module search path.
    SWIFT_INCLUDE_PATHS:
      - "$(inherited)"
      - "$(BUILD_DIR)/../../swift-collections/build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"

packages:
  GhosttyKit:
    path: Packages/GhosttyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: "2.9.5"
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.0.0"
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor.git
    exactVersion: "0.15.2"
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages.git
    exactVersion: "0.1.20"
  # Pinned by revision (tag 1.1.0's commit) rather than version: RoyalVNCKit
  # depends on a branch-pinned CryptoSwift fork, and SwiftPM only allows a
  # branch sub-dependency when the parent is itself pinned by branch/revision
  # ("unstable"). The revision keeps the build reproducible.
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc.git
    revision: 92d4427c73817d8f849bb289ff190aa4b40c44ea

schemes:
  SharedTests:
    build:
      targets:
        SharedTests: [test]
    test:
      targets:
        - name: SharedTests
          parallelizable: false
  PilotTests:
    build:
      targets:
        PilotTests: [test]
    test:
      targets:
        - name: PilotTests
          parallelizable: false
  Pilot:
    build:
      targets:
        Pilot: [run, test, profile, analyze, archive]
    run:
      config: Chromium
  # App schemes wired to run their fastlane snapshot UI-test bundles.
  Copilot:
    build:
      targets:
        Copilot: [run, test, profile, analyze, archive]
        CopilotUITests: [test]
    test:
      targets:
        - name: CopilotUITests
          parallelizable: false
  Plotter:
    build:
      targets:
        Plotter: [run, test, profile, analyze, archive]
        PlotterUITests: [test]
    test:
      targets:
        - name: PlotterUITests
          parallelizable: false

targets:
  # Build ChromiumKit as a configuration-scoped Xcode target. SwiftPM package
  # manifest environment is cached by Xcode, so using it to select the CEF
  # implementation can leak a prior Chromium resolution into Debug/Release.
  ChromiumKit:
    type: framework.static
    platform: macOS
    sources:
      - path: Packages/ChromiumKit/Sources/ChromiumKit/ChromiumKit.mm
      - path: Packages/ChromiumKit/Sources/ChromiumKit/include/ChromiumKit/ChromiumKit.h
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.chromiumkit
        PRODUCT_NAME: ChromiumKit
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_ENABLE_MODULES: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
      configs:
        Chromium:
          ENABLE_USER_SCRIPT_SANDBOXING: false
          GCC_PREPROCESSOR_DEFINITIONS:
            - "$(inherited)"
            - "BLAU_CHROMIUM_CEF_ENABLED=1"
          HEADER_SEARCH_PATHS:
            - "$(inherited)"
            - "$(PROJECT_DIR)/Packages/ChromiumKit/Artifacts/CEF"
    preBuildScripts:
      - name: Verify Installed ChromiumKit Runtime
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$CONFIGURATION" != "Chromium" ]]; then
            exit 0
          fi
          "$SRCROOT/bin/verify-installed-chromiumkit.sh"

  Pilot:
    type: application
    platform: macOS
    productName: made
    sources:
      - Sources/Pilot
      - path: Sources/Shared
        # Audio capture + Whisper transcription live on Copilot now —
        # Pilot just receives the finished text over the sync channel.
        excludes:
          - "TranscriptionService.swift"
    dependencies:
      - package: GhosttyKit
      - package: Sparkle
        product: Sparkle
      - target: ChromiumKit
        embed: false
      - target: PilotChromiumHelperTemplate
        embed: false
      - package: CodeEditSourceEditor
        product: CodeEditSourceEditor
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: RoyalVNCKit
        product: RoyalVNCKit
        embed: true
      - package: Sparkle
        product: Sparkle
        # Link-only: Sparkle's product is a binary xcframework and XcodeGen's
        # Embed Frameworks phase cannot copy it ("Sparkle-product" build
        # error). Xcode embeds and root-signs it implicitly on link; the
        # Sign Sparkle prebuild phase re-signs its nested code to match the
        # release validator's same-team/no-entitlements policy.
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.pilot
        PRODUCT_NAME: made
        # The Swift module keeps the Pilot name: tests and qualified references
        # use it, and only the bundle/executable were renamed to made.
        PRODUCT_MODULE_NAME: Pilot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Pilot/Pilot.entitlements
        # The Assemble Chromium Runtime script phase copies and signs
        # frameworks inside the built app bundle, which the user-script
        # sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Pilot/Info.plist
        OTHER_LDFLAGS: ["-lc++", "-framework", "Metal", "-framework", "MetalKit", "-framework", "QuartzCore", "-framework", "CoreText", "-framework", "IOKit", "-framework", "IOSurface", "-framework", "CoreGraphics", "-framework", "Foundation", "-framework", "Carbon", "-framework", "CoreFoundation", "-framework", "AppKit", "-framework", "CoreServices", "-framework", "AVFoundation", "-framework", "CoreMedia", "-framework", "CoreMediaIO"]
      configs:
        # Debug signs with the stable Apple Development identity (team from the
        # project-level base settings), NOT ad-hoc. macOS keys TCC grants —
        # notably Screen Recording for the window mirror — to the signing
        # identity; an ad-hoc signature's hash changes every build, so the
        # grant is invalidated and the system re-prompts on each run. A stable
        # identity makes the grant persist across rebuilds.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Chromium:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          ENABLE_HARDENED_RUNTIME: true
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: false
          BLAU_CHROMIUM_CODESIGN_TIMESTAMP: YES
          GCC_PREPROCESSOR_DEFINITIONS:
            - "$(inherited)"
            - "BLAU_CHROMIUM_CEF_ENABLED=1"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS:
            - "$(inherited)"
            - BLAU_CHROMIUM_CEF_ENABLED
          HEADER_SEARCH_PATHS:
            - "$(inherited)"
            - "$(PROJECT_DIR)/Packages/ChromiumKit/Artifacts/CEF"
          LIBRARY_SEARCH_PATHS:
            - "$(inherited)"
            - "$(PROJECT_DIR)/Packages/ChromiumKit/Artifacts/CEF/lib"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-lcef_dll_wrapper"
    postBuildScripts:
      - name: Embed AirPlay Receiver
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        # Declare every embedded output so an incremental helper/source update
        # invalidates the app's resource seal and schedules CodeSign again.
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/CockpitAirPlayReceiver"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/README.md"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/LICENSE-UxPlay"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/LICENSE-libplist"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/LICENSE-OpenSSL"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/uxplay.tar.gz"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/libplist.tar.bz2"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/openssl.tar.gz"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/main.cpp"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/bounds.patch"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/tests.cpp"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/AirPlay/Sources/build-airplay-receiver.sh"
        script: |
          "$SRCROOT/bin/embed-airplay-receiver.sh"
      - name: Embed Sparkle
        # Xcode embeds the linked Sparkle binary product implicitly; this
        # phase re-signs that copy in place (see embed-sparkle.sh). The inputs
        # order the phase after Xcode's copy/sign-on-copy; no outputFiles are
        # declared, so the phase still runs on every build (the signing
        # identity differs between lanes: ad-hoc smoke, Apple Development,
        # Developer ID).
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/Sparkle.framework"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/Sparkle.framework/Versions/Current/_CodeSignature/CodeResources"
        script: |
          "$SRCROOT/bin/embed-sparkle.sh"
      - name: Assemble Chromium Runtime
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$CONFIGURATION" != "Chromium" ]]; then
            exit 0
          fi
          "$SRCROOT/bin/assemble-chromium-runtime.sh" \
            "$TARGET_BUILD_DIR/$WRAPPER_NAME" \
            "$BUILT_PRODUCTS_DIR/PilotChromiumHelperTemplate.app" \
            "$EXPANDED_CODE_SIGN_IDENTITY"

  PilotChromiumHelperTemplate:
    type: application
    platform: macOS
    sources:
      - Sources/PilotChromiumHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.pilot.helper-template
        PRODUCT_NAME: PilotChromiumHelperTemplate
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/PilotChromiumHelper/Info.plist
        SKIP_INSTALL: true
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
      configs:
        Chromium:
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: true
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: false
          GCC_PREPROCESSOR_DEFINITIONS:
            - "$(inherited)"
            - "BLAU_CHROMIUM_CEF_ENABLED=1"
          HEADER_SEARCH_PATHS:
            - "$(inherited)"
            - "$(PROJECT_DIR)/Packages/ChromiumKit/Artifacts/CEF"
          LIBRARY_SEARCH_PATHS:
            - "$(inherited)"
            - "$(PROJECT_DIR)/Packages/ChromiumKit/Artifacts/CEF/lib"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-lcef_dll_wrapper"

  Copilot:
    type: application
    platform: iOS
    sources:
      - Sources/Copilot
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.copilot
        PRODUCT_NAME: Copilot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Copilot/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        # Lets the shared SettingsView surface the Copilot-only secure
        # messaging screen (issue #51) without leaking it into Pilot/Plotter.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: COPILOT
    dependencies:
      - target: Wingman Watch App
      - package: WhisperKit
        product: WhisperKit

  Plotter:
    type: application
    platform: iOS
    sources:
      - Sources/Plotter
      - Sources/PlotterShared
      - path: Sources/Shared
        # Plotter mirrors + draws over the sync channel; it has no audio
        # capture, so the Whisper-backed transcription service is excluded.
        excludes:
          - "TranscriptionService.swift"
    dependencies:
      - target: PlotterWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.plotter
        PRODUCT_NAME: Plotter
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Plotter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Plotter/Plotter.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  PlotterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/PlotterWidgets
      - Sources/PlotterShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.plotter.widgets
        PRODUCT_NAME: PlotterWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/PlotterWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PlotterWidgets/PlotterWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: true

  Wingman Watch App:
    type: application
    platform: watchOS
    sources:
      - Sources/Wingman/Wingman Watch App
      - Sources/Shared/WingmanDeliveryState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.copilot.watchkitapp
        PRODUCT_NAME: Wingman
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Trigger
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.blau.copilot
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        SDKROOT: watchos

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SharedTests
      - Sources/PlotterShared/PlotterGeometry.swift
    dependencies:
      - target: Copilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.copilot.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Copilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Copilot"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PilotTests
      - path: Tests/Fixtures/ChromiumBrowser
        type: folder
        buildPhase: resources
      - path: Packages/ChromiumKit/performance-budgets.json
        buildPhase: resources
    dependencies:
      - target: Pilot
      - target: ChromiumKit
        embed: false
      - package: RoyalVNCKit
        product: RoyalVNCKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.pilot.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/made.app/Contents/MacOS/made"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Chromium:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS:
            - "$(inherited)"
            - BLAU_CHROMIUM_REAL_ENGINE_TESTS

  CopilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/CopilotUITests
    dependencies:
      - target: Copilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.copilot.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Copilot

  PlotterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/PlotterUITests
    dependencies:
      - target: Plotter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blau.plotter.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Plotter
